# ═══════════════════════════════════════════════════════════════════
# Deploy automático a Netlify
#
# Para activar este workflow:
# 1. Moverlo a .github/workflows/ (renombrarlo a deploy-netlify.yml).
# 2. En netlify.com crear el sitio conectando el repo de GitHub.
#    Netlify, igual que Vercel, maneja el deploy automáticamente
#    mediante su propia integración.
# 3. Si querés control total vía Actions, usá este workflow con secrets:
#    - NETLIFY_AUTH_TOKEN
#    - NETLIFY_SITE_ID
# ═══════════════════════════════════════════════════════════════════

name: Deploy · Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy desde GitHub Actions · ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
